services:
  postgres:
    image: postgres:16-alpine
    container_name: wayfarer-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  test-postgres:
    image: postgres:16-alpine
    container_name: wayfarer-test-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54323:5432"
    volumes:
      - pgtestdata:/var/lib/postgresql/data

  storage:
    image: rustfs/rustfs:latest
    container_name: wayfarer-storage
    restart: always
    environment:
      RUSTFS_ACCESS_KEY: "rustfsadmin"
      RUSTFS_SECRET_KEY: "rustfsadmin"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfsdata:/data

volumes:
  pgdata:
  pgtestdata:
  rustfsdata:
