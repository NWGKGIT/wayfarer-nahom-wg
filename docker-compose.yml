services:
  postgres:
    image: postgres:16-alpine
    container_name: wayfarer-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  test-postgres:
    image: postgres:16-alpine
    container_name: wayfarer-test-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54323:5432"
    volumes:
      - pgtestdata:/var/lib/postgresql/data

  storage:
    image: minio/minio:latest
    container_name: wayfarer-storage
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  pgtestdata:
  miniodata:
